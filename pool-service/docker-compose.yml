# Pool Service: local development and the VPS deployment.
#
#   docker compose up -d mongo        # just the database, for `npm run dev` / tests
#   docker compose up -d --build      # database + API (what the VPS runs)
#
# Mongo runs as a single-node replica set because /sync/package uses transactions.
# On the VPS, the host's cloudflared (Cloudflare Tunnel) forwards
# https://poolapp.evolutiondfw.com to http://localhost:3000.
name: pool-service

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    logging: *logging
    volumes:
      - ./data/mongo:/data/db
    # Bound to localhost only: reachable from the server itself (dev, tests, backups), never from outside.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }; db.hello().isWritablePrimary || quit(1)"
      # Every 30 s once running (was 5 s: needless load); every 2 s while starting, so a restart
      # is still quick. Same as the GPF tenants.
      interval: 30s
      start_interval: 2s
      timeout: 10s
      start_period: 60s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/pool?replicaSet=rs0
      PHOTO_DIR: /data/photos
      BACKUP_DIR: /backups
      # Links in emails (password reset). The app queues mail; deploy/mail.sh sends it (cron, every minute).
      PUBLIC_URL: https://poolapp.evolutiondfw.com
    volumes:
      - ./data/photos:/data/photos
      # Read-only: the More screen shows the last backup time from backups/LAST_BACKUP.
      - ./backups:/backups:ro
    depends_on:
      mongo:
        condition: service_healthy
    # Localhost only. The Cloudflare Tunnel on the host connects here.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Phone alerts (Phase 6). Self-hosted ntfy; the Android ntfy app subscribes to topic
  # "pool-alerts" at https://ntfy.evolutiondfw.com (a public hostname on the same Cloudflare
  # Tunnel, pointing at http://localhost:2586). Nobody can read or post without a login/token.
  # deploy/monitor.sh posts here. Users and tokens: deploy/README.md, "Alerts".
  ntfy:
    image: binwiederhier/ntfy:v2.15.0
    command: serve
    restart: unless-stopped
    logging: *logging
    environment:
      NTFY_BASE_URL: https://ntfy.evolutiondfw.com
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_WEB_ROOT: disable
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    # Localhost only. The Cloudflare Tunnel on the host connects here.
    ports:
      - "127.0.0.1:2586:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://127.0.0.1:80/v1/health | grep -q true"]
      interval: 60s
      timeout: 5s
      retries: 3
